# =============================================================================
# Deep Link Engine — PostgreSQL settings for Profile A (docs/zadanie.md §B.8, NFR-10):
# the WHOLE stack shares 2 vCPU / 4 GB RAM / 20 GB disk, and docker-compose.yml caps the
# postgres container at 1 vCPU / 1.5 GB. Included from postgresql.conf by
# deploy/postgres/init/00-include-tuning.sh (first initialisation only). Restart to apply:
#   docker compose restart postgres
# Anything here can be overridden per role/database with ALTER SYSTEM / ALTER DATABASE.
# =============================================================================

# ---- memory (1.5 GB container) --------------------------------------------------------------
# shared_buffers: ~half of the container memory. The working set of DLE is small — links,
# app_domains and the current click_events day — so the rest is better left to the OS cache
# (effective_cache_size tells the planner it exists; it allocates nothing).
shared_buffers = 768MB
effective_cache_size = 1536MB
# Per sort/hash operation, per query node; 200 connections x a few MB stays inside the cap.
work_mem = 8MB
maintenance_work_mem = 128MB
# Huge pages are not available inside an unprivileged container; avoid the start-up warning.
huge_pages = off

# ---- connections -----------------------------------------------------------------------------
# 2 edge replicas x Dle:Persistence:Fast:MaxPoolSize (32 in docker-compose.yml) + the control
# plane's EF Core pool (Npgsql default 100) + the migration and an operator: 200 with room.
max_connections = 200
superuser_reserved_connections = 3
idle_in_transaction_session_timeout = 60s

# ---- WAL and checkpoints (20 GB disk) --------------------------------------------------------
wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_compression = lz4

# ---- planner (SSD) ---------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
# The hot path is short point queries on covering indexes; JIT only adds compile latency.
jit = off

# ---- autovacuum ------------------------------------------------------------------------------
# DLE's resolve path relies on Index Only Scans over ix_links_resolve (§B.5.2). An index-only
# scan can only skip the heap for pages the visibility map marks all-visible, and it is VACUUM
# that sets that bit — so on a 4 GB box autovacuum must run early and often rather than in big,
# rare passes.
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 15s
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000
# Deployment-wide defaults: vacuum at 10 % dead tuples, analyse at 5 % change.
autovacuum_vacuum_scale_factor = 0.10
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_insert_scale_factor = 0.10
# click_events is append-only and partitioned daily; freeze aggressively so old partitions are
# never rewritten by a wraparound vacuum at an inconvenient time.
vacuum_freeze_min_age = 10000000
log_autovacuum_min_duration = 1s

# ---- per-table: links (planner note in docs/zadanie.md §B.5.2) ------------------------------
# "INCLUDE makes the index covering, but an Index Only Scan only works with a well maintained
#  visibility map. Set autovacuum_vacuum_scale_factor = 0.02 on the links table and verify with
#  EXPLAIN (ANALYZE, BUFFERS) that the index-only scan is really used — otherwise the latency
#  budget of §B.6.1 does not hold."
# Storage parameters are per table, so they cannot live in this file. The InitialSchema migration
# applies it (DlePostgresScripts.TuneLinksAutovacuum, src/Dle.Persistence/Sql); re-apply by hand
# after a restore from a dump that dropped storage parameters:
#
#   ALTER TABLE links SET (autovacuum_vacuum_scale_factor = 0.02);
#   -- and check:
#   SELECT reloptions FROM pg_class WHERE relname = 'links';
#   EXPLAIN (ANALYZE, BUFFERS) SELECT ... FROM links WHERE domain_id = ... AND slug = ...;
#     -> "Index Only Scan using ix_links_resolve" with "Heap Fetches: 0" (or close to it)
#
# With 0.02, a links table of 1 000 000 rows is vacuumed after ~20 000 updates (plus the
# 50-row threshold) instead of ~100 000, keeping the visibility map fresh at negligible cost.

# ---- logging ----------------------------------------------------------------------------------
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 8MB
log_line_prefix = '%m [%p] %q%u@%d app=%a '
track_io_timing = on
# pg_stat_statements is worth its cost even here; see shared_preload_libraries below.

# ---- misc -------------------------------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
password_encryption = scram-sha-256

# ---- preload libraries ----------------------------------------------------------------------
# pg_stat_statements is in contrib and always available. pg_partman_bgw exists only in an image
# that has pg_partman (deploy/docker/Dockerfile.postgres); a server without the library REFUSES
# TO START when it is listed, which is why the partman lines are commented out. Enable them
# together with POSTGRES_IMAGE=dle-postgres:18 and run `CREATE EXTENSION pg_stat_statements;`.
shared_preload_libraries = 'pg_stat_statements'
# shared_preload_libraries = 'pg_stat_statements,pg_partman_bgw'
# pg_partman_bgw.interval = 3600
# pg_partman_bgw.role = 'dle'
# pg_partman_bgw.dbname = 'dle'
