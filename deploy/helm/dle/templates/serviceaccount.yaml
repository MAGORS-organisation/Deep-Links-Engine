{{- /*
One ServiceAccount for the edge and the control plane. Neither talks to the Kubernetes API, so
the token is not mounted (serviceAccount.automountServiceAccountToken, repeated at pod level in
every pod spec so a cluster-wide default cannot re-enable it).

The migration Job gets a second, hook-scoped copy, for the same reason its Secret does: a
pre-install hook runs before regular resources exist, and a pod whose ServiceAccount is missing
is never created at all — the Job just sits there until activeDeadlineSeconds ends it, reporting
no failed pods because there were none. The copy carries the same annotations as the original:
on EKS and GKE those are the workload identity the migration needs to reach the database.
Helm never garbage-collects hook resources, so `helm uninstall` leaves it behind, which is also
what lets the Job be re-run by hand; NOTES.txt and deploy/README.md say how to remove it.
*/ -}}
{{- if .Values.serviceAccount.create }}
{{- $annotations := mergeOverwrite (dict) .Values.commonAnnotations .Values.serviceAccount.annotations }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dle.serviceAccountName" . }}
  labels:
    {{- include "dle.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- if .Values.migrate.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dle.migrate.serviceAccountName" . }}
  labels:
    {{- include "dle.migrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ include "dle.migrate.hooks" . }}
    # Created before the Job (weight 0), alongside the hook-scoped Secret; replaced on every run.
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
