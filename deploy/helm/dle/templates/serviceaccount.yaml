{{- /*
One ServiceAccount for the edge, the control plane and the migration Job. None of them talks to
the Kubernetes API, so the token is not mounted (serviceAccount.automountServiceAccountToken,
repeated at pod level in every pod spec so a cluster-wide default cannot re-enable it).
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dle.serviceAccountName" . }}
  labels:
    {{- include "dle.labels" . | nindent 4 }}
  {{- $annotations := mergeOverwrite (dict) .Values.commonAnnotations .Values.serviceAccount.annotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
