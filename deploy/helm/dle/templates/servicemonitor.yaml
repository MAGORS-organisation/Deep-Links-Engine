{{- /*
Prometheus Operator ServiceMonitor, off by default. Enabling it turns on the native GET /metrics
endpoint of Edge and Control (dle.metricsEnv) and scrapes it with the bearer token from the
release's Secret: the Ingress forwards /metrics, so it must never be anonymous here.
Selects both Services of the release (they share app.kubernetes.io/name and /instance) on their named `http` port.
*/ -}}
{{- if .Values.serviceMonitor.enabled }}
{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.metricsScrapeToken) }}
{{- fail "serviceMonitor.enabled needs secrets.metricsScrapeToken (or that key in secrets.existingSecret): the Ingress forwards /metrics, so it must require a token" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dle.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.serviceMonitor.namespace }}
  labels:
    {{- include "dle.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "dle.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "dle.secretName" . }}
          key: {{ .Values.secrets.keys.metricsScrapeToken }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
