{{- /*
Rendered ONLY when secrets.existingSecret is empty (the recommended path is an operator-managed
Secret with the keys named in secrets.keys — nothing secret then enters Helm's release history).

Two objects share one data block (dle.secretData):
  1. <fullname>          regular resource, read by the edge and control deployments.
  2. <fullname>-migrate  hook-scoped copy for the migration Job. Pre-install hooks run BEFORE
                         regular resources exist, so the Job cannot reference (1). Helm never
                         garbage-collects hook resources: `helm uninstall` leaves this copy
                         behind — NOTES.txt and deploy/README.md say how to remove it.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dle.fullname" . }}
  labels:
    {{- include "dle.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- include "dle.secretData" . | nindent 2 }}
{{- if .Values.migrate.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dle.migrate.fullname" . }}
  labels:
    {{- include "dle.migrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ include "dle.migrate.hooks" . }}
    # Created before the Job (weight 0) and the hook NetworkPolicy; replaced on every run.
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- include "dle.secretData" . | nindent 2 }}
{{- end }}
{{- end }}
