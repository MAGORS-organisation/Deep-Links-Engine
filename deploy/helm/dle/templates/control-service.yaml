apiVersion: v1
kind: Service
metadata:
  name: {{ include "dle.control.fullname" . }}
  labels:
    {{- include "dle.control.labels" . | nindent 4 }}
  {{- $annotations := mergeOverwrite (dict) .Values.commonAnnotations .Values.control.service.annotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.control.service.type }}
  ports:
    - name: http
      port: {{ .Values.control.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "dle.control.selectorLabels" . | nindent 4 }}
