apiVersion: v2
name: dle
description: |
  Deep Link Engine (DLE) — self-hosted, EU-first deep linking and attribution engine.
  Profile B of docs/zadanie.md §B.8: an autoscaled edge (data plane) behind an Ingress, a
  two-replica control plane, PostgreSQL primary + read replicas and a Valkey cluster.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/MAGORS-organisation/Deep-Links-Engine
sources:
  - https://github.com/MAGORS-organisation/Deep-Links-Engine
keywords:
  - deep-links
  - universal-links
  - app-links
  - attribution
  - aspnetcore
maintainers:
  - name: MAGORS organisation
    url: https://github.com/MAGORS-organisation
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "true"

# Optional bundled data stores — EVALUATION CONVENIENCE ONLY, both off by default.
#
# Production Profile B wants a PostgreSQL primary with two read replicas and a Valkey cluster
# (§B.8). Run those with an operator (CloudNativePG, a managed service) or the platform's own
# charts and hand this chart the connection strings (externalPostgres.*, externalValkey.*).
#
# Helm refuses to install a chart whose declared dependencies are not in charts/, even when their
# condition is false. Therefore either run `helm dependency build deploy/helm/dle` once, or pass
# `--dependency-update` to helm install/upgrade. The versions below are pinned to what
# oci://registry-1.docker.io/bitnamicharts served when the Helm chart workflow first resolved
# them; bump them deliberately, with that workflow as the check.
dependencies:
  - name: postgresql
    version: "18.11.1"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
    tags:
      - bundled
  - name: valkey
    version: "4.1.3"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: valkey.enabled
    tags:
      - bundled
