[versions]
# AGP 9.3 is the newest line inside Kotlin 2.4's supported range (AGP <= 9.3.1, Gradle <= 9.7.0)
# and compiles against API 37. AGP 9 has Kotlin built in, so there is no kotlin-android plugin.
agp = "9.3.1"
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.13.0"
okhttp = "4.12.0"
installreferrer = "2.2"
securityCrypto = "1.1.0-alpha06"
junit5 = "5.11.3"
junitPlatform = "6.1.3"
androidxCore = "1.19.1"
androidxAppcompat = "1.8.0"
androidxActivity = "1.9.3"
androidxLifecycle = "2.8.7"
material = "1.14.0"

[libraries]
# Put on the root buildscript classpath so AGP's built-in Kotlin compiles with this Kotlin version.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

installreferrer = { module = "com.android.installreferrer:installreferrer", version.ref = "installreferrer" }

# compileOnly in the SDK: the app decides whether it wants encrypted storage (see SecurePreferences).
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
