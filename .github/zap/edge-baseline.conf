# zap-baseline.py rule configuration for the edge (data plane) scan — docs/zadanie.md §C.8
# "release: ZAP baseline", §E.8 S-04 (CSP on the interstitial without unsafe-inline).
#
# Format: <rule id><TAB><IGNORE|WARN|FAIL><TAB>(<rule name, informational>)
# Every rule not listed here stays at ZAP's default (WARN), and with fail_action=true a WARN
# fails the job. Only rules that cannot say anything useful about a redirector are ignored;
# NOTHING header- or CSP-related is silenced here — those are exactly what S-04 asks for.
10027	IGNORE	(Information Disclosure - Suspicious Comments)
10049	IGNORE	(Storable and Cacheable Content)
10096	IGNORE	(Timestamp Disclosure)
10109	IGNORE	(Modern Web Application)
