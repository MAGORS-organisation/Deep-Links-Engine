# =============================================================================
# Release — on a `v*` tag.
#
#   version ─┬─ ci (reusable: build, format, all four suites, coverage gate)
#            ├─ sbom (reusable: SBOM ×3 + CBOM, schema-validated)
#            ├─ images  [edge, control]  buildx linux/amd64+arm64 → ghcr.io as :VERSION only,
#            │                           provenance + SBOM attestations, cosign keyless signature
#            ├─ helm    after gates + loadtest: lint → package → push oci://ghcr.io/<owner>/charts → cosign sign
#            ├─ gates   compose stack from the pushed images: Trivy (hard) → smoke (/healthz,
#            │          /readyz, edge stays up with postgres stopped) → ZAP baseline (hard)
#            ├─ loadtest k6 resolve profile on its own machine (DLE_LOADTEST_RUNNER, see below)
#            ├─ promote plain tags whose k6 gate passed: :MAJOR.MINOR and :latest → the gated digest
#            └─ release cosign sign-blob SBOM/CBOM → GitHub release with SBOM, CBOM, chart, digests
#
# k6 gate (the loadtest job): tests/load/resolve.js, with a corpus seeded by tests/load/seed.js. By
# default the job starts the compose stack from the released images with
# tests/load/compose.loadtest.yml (resolve limiter off, 404 budget lifted, the machine's CPUs), and
# tests/load/run-on-compose.sh registers link.dle.test with the throw-away bootstrap owner key (a
# domain is active at once while Dle:Control:RequireDomainOwnershipVerification is off, its
# default), points it at 127.0.0.1 and runs the profile straight against the edge. Stack and
# generator share the machine, and the release notes say so. A standard runner (4 vCPU) holds the
# steady scenario but cannot generate the 12 000/s spike next to the stack, so a GA tag needs a
# larger machine: set the repository variable DLE_LOADTEST_RUNNER to the runs-on label of a larger
# GitHub-hosted runner or of a dedicated self-hosted one (Linux x64 with Docker, curl and jq, and
# 127.0.0.1 link.dle.test in /etc/hosts or passwordless sudo; on a public repository with fork pull
# request workflows from outside collaborators requiring approval, since a workflow chooses its own
# runner). Only this job runs there. Delete the variable before the machine goes away, or every
# later tag waits for a runner that no longer exists. A persistent staging instance takes the
# stack's place when all four repository secrets are set:
#   DLE_LOADTEST_CONTROL_URL, DLE_LOADTEST_API_KEY, DLE_LOADTEST_DOMAIN_ID, DLE_LOADTEST_LINK_HOST
# The thresholds inside resolve.js decide. For a plain tag a miss fails the release; for a
# pre-release tag it is reported and the release stays a pre-release. Only a plain tag whose run
# passed becomes a full release and moves :MAJOR.MINOR and :latest.
#
# Image names are ghcr.io/<owner lower-cased>/dle-edge and dle-control, matching the defaults in
# deploy/docker-compose.yml and deploy/helm/dle/values.yaml.
# =============================================================================
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------------------------
  version:
    name: Version from tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - name: Parse
        id: v
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease][+build]"; exit 1
          fi
          prerelease=false; case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version prerelease=$prerelease owner=${OWNER,,}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # deploy/docker-compose.yml and deploy/.env.example pin the image tag a plain `docker compose
      # pull` gets, and they are bumped by hand. The gates below override DLE_VERSION, so without
      # this check a release could ship a compose file that still pulls the previous version. The
      # pin is the release core: v1.0.0-rc.1 and v1.0.0 both expect 1.0.0.
      - name: Compose pins this release
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          core="${VERSION%%[-+]*}"
          missing=0
          count=$(grep -cF "\${DLE_VERSION:-$core}" deploy/docker-compose.yml || true)
          images=$(grep -cF '${DLE_VERSION:-' deploy/docker-compose.yml || true)
          if [ "$count" -eq 0 ] || [ "$count" -ne "$images" ]; then
            echo "::error file=deploy/docker-compose.yml::every \${DLE_VERSION:-…} default must be $core ($count of $images are)"; missing=1
          fi
          if ! grep -qx "DLE_VERSION=$core" deploy/.env.example; then
            echo "::error file=deploy/.env.example::DLE_VERSION must be $core"; missing=1
          fi
          exit "$missing"

      # A plain tag is a supported release and must not ship a preview or release-candidate package;
      # a pre-release tag may, and its notes come from the same Directory.Packages.props.
      - name: No prerelease packages in a plain release
        if: ${{ steps.v.outputs.prerelease == 'false' }}
        run: |
          if grep -nE 'Version="[^"]*-(alpha|beta|preview|rc)[^"]*"' Directory.Packages.props; then
            echo "::error file=Directory.Packages.props::a plain release cannot depend on the prerelease packages listed above; tag a pre-release or move them to GA"
            exit 1
          fi

  # ---------------------------------------------------------------------------------------------
  ci:
    name: CI
    needs: [version]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  sbom:
    name: SBOM
    needs: [version]
    uses: ./.github/workflows/sbom.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read

  # ---------------------------------------------------------------------------------------------
  images:
    name: Image dle-${{ matrix.image }}
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (Fulcio certificate bound to this workflow's OIDC identity)
    strategy:
      fail-fast: false
      matrix:
        image: [edge, control]
    env:
      IMAGE: ghcr.io/${{ needs.version.outputs.owner }}/dle-${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (arm64 emulation for the runtime stage)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Only the exact version here. The moving tags (MAJOR.MINOR, latest) are what anyone who
          # follows a release line pulls, so the promote job sets them after the gates have passed.
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=dle-${{ matrix.image }}
            org.opencontainers.image.vendor=Kyberware
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build date
        id: now
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.now.outputs.date }}
          # BuildKit attestations, attached to the image index: SLSA provenance and a per-image SBOM.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=dle-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=dle-${{ matrix.image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image index (keyless, Rekor-logged)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the signature we just made
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v" \
            | head -c 2000

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "digests/dle-${{ matrix.image }}.txt"
          echo "dle-${{ matrix.image }}: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.image }}
          path: digests/*.txt
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------------------------
  helm:
    name: Helm chart
    # After the gates and the k6 gate: like the GitHub release, the chart is stable only for a plain
    # tag whose load test passed. A failed job publishes no chart; a pre-release tag whose k6 run
    # missed still publishes one, marked prerelease.
    needs: [version, ci, gates, loadtest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      CHART_DIR: deploy/helm/dle
      CHART_OCI: oci://ghcr.io/${{ needs.version.outputs.owner }}/charts
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease == 'true' || needs.loadtest.outputs.loadtest != 'ran' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Resolve chart dependencies
        # Chart.yaml declares optional bitnami postgresql/valkey sub-charts, pinned to exact versions
        # that helm.yml resolves on every chart change. If this step fails, the registry no longer
        # serves a pinned version and Chart.yaml needs a deliberate bump, checked by helm.yml.
        run: helm dependency update "$CHART_DIR"

      - name: Lint
        run: helm lint "$CHART_DIR"

      - name: Package
        run: |
          mkdir -p chart
          # Artifact Hub reads the prerelease flag from Chart.yaml; derive it from the tag and the
          # k6 gate, exactly as the GitHub release does.
          sed -i "s|^  artifacthub.io/prerelease: .*|  artifacthub.io/prerelease: \"$PRERELEASE\"|" "$CHART_DIR/Chart.yaml"
          grep -q "^  artifacthub.io/prerelease: \"$PRERELEASE\"$" "$CHART_DIR/Chart.yaml"
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination chart
          ls -l chart

      - name: Push to GHCR and sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "chart/dle-${VERSION}.tgz" "$CHART_OCI" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: *//p' push.log | tr -d '[:space:]')"
          if [ -z "$digest" ]; then echo "::error::helm push printed no digest"; exit 1; fi
          ref="ghcr.io/${{ needs.version.outputs.owner }}/charts/dle@${digest}"
          cosign sign --yes "$ref"
          echo "helm chart: ${ref}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: chart/*.tgz
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------------------------
  gates:
    name: Release gates (compose smoke, ZAP)
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILES: -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml
      DLE_VERSION: ${{ needs.version.outputs.version }}
      DLE_EDGE_IMAGE: ghcr.io/${{ needs.version.outputs.owner }}/dle-edge:${{ needs.version.outputs.version }}
      DLE_CONTROL_IMAGE: ghcr.io/${{ needs.version.outputs.owner }}/dle-control:${{ needs.version.outputs.version }}
      DLE_DOMAIN: localhost
      DLE_TLS: internal
      DLE_HTTP_PORT: "8088"
      DLE_HTTPS_PORT: "8443"
      # Placeholders so that the "Stack logs" and "Tear down" steps can interpolate the compose file
      # (every :? variable must be set) even when the job fails before the throw-away-secrets step
      # has run. That step overrides all four through GITHUB_ENV for the real stack; these values
      # never reach a running container. DLE_DOMAIN, the fifth required variable, is set above.
      POSTGRES_PASSWORD: placeholder-overridden-before-the-stack-starts
      VALKEY_PASSWORD: placeholder-overridden-before-the-stack-starts
      DLE_MASTER_SECRET: placeholder-overridden-before-the-stack-starts-32chars
      DLE_EDGE_SECRET: placeholder-overridden-before-the-stack-starts-edge-32
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR (the packages may be private on first publish)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Throw-away secrets for this stack
        # All four are required by the compose file (:? interpolation). Random, masked, never reused.
        run: |
          pg="$(openssl rand -hex 24)"; vk="$(openssl rand -hex 24)"; ms="$(openssl rand -base64 48 | tr -d '\n')"; es="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$pg"; echo "::add-mask::$vk"; echo "::add-mask::$ms"; echo "::add-mask::$es"
          echo "POSTGRES_PASSWORD=$pg" >> "$GITHUB_ENV"
          echo "VALKEY_PASSWORD=$vk" >> "$GITHUB_ENV"
          echo "DLE_MASTER_SECRET=$ms" >> "$GITHUB_ENV"
          echo "DLE_EDGE_SECRET=$es" >> "$GITHUB_ENV"

      - name: Start the stack from the released images
        run: |
          docker compose $COMPOSE_FILES pull --quiet
          docker compose $COMPOSE_FILES up -d --no-build --wait --wait-timeout 300
          curl -fsS http://127.0.0.1:8080/healthz && echo " edge healthy"
          curl -fsS http://127.0.0.1:8081/healthz && echo " control healthy"
          curl -fsS http://127.0.0.1:8081/readyz  && echo " control ready"

      # The released images themselves (the host-arch variant just pulled), with the same policy as
      # the trivy-image job of security.yml.
      - name: Trivy — dle-edge as released (hard gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.DLE_EDGE_IMAGE }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy — dle-control as released (hard gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.DLE_CONTROL_IMAGE }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

      - name: Smoke — edge stays up with PostgreSQL down, control reports not-ready
        # The edge serves from cache and must not fall over with the database (chaos tests
        # in Dle.IntegrationTests); /readyz on control gates on the database and must say so.
        run: |
          docker compose $COMPOSE_FILES stop postgres
          sleep 5
          curl -fsS http://127.0.0.1:8080/healthz && echo " edge still healthy without postgres"
          if curl -fsS http://127.0.0.1:8081/readyz; then echo "::error::control /readyz returned success with postgres stopped"; exit 1; fi
          echo " control correctly not ready"
          docker compose $COMPOSE_FILES start postgres
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/readyz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8081/readyz && echo " control ready again"

      - name: ZAP baseline scan of the edge (hard gate)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          rules_file_name: .github/zap/edge-baseline.conf
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-edge-release

      - name: Stack logs (on failure)
        if: ${{ failure() }}
        run: docker compose $COMPOSE_FILES logs --no-color --tail 300

      - name: Tear down
        if: ${{ always() }}
        run: docker compose $COMPOSE_FILES down --volumes --remove-orphans

  # ---------------------------------------------------------------------------------------------
  loadtest:
    name: k6 resolve profile
    needs: [version, images]
    # A larger machine for the 12 000/s spike (see the header); the standard runner otherwise.
    runs-on: ${{ vars.DLE_LOADTEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    outputs:
      # ran = the thresholds held; failed = they did not, which only a pre-release tag gets past.
      loadtest: ${{ steps.k6.outcome == 'success' && 'ran' || 'failed' }}
      loadtest_target: ${{ steps.k6.outputs.target }}
    env:
      COMPOSE_FILES: -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml -f tests/load/compose.loadtest.yml
      DLE_VERSION: ${{ needs.version.outputs.version }}
      DLE_EDGE_IMAGE: ghcr.io/${{ needs.version.outputs.owner }}/dle-edge:${{ needs.version.outputs.version }}
      DLE_CONTROL_IMAGE: ghcr.io/${{ needs.version.outputs.owner }}/dle-control:${{ needs.version.outputs.version }}
      DLE_DOMAIN: localhost
      DLE_TLS: internal
      # Caddy is the one service docker-compose.yml publishes; on a self-hosted machine with no
      # inbound firewall the throw-away stack would otherwise face the network (Docker's own
      # iptables rules bypass ufw, and the daemon's "ip" default does not reach compose networks).
      DLE_HTTP_PORT: "127.0.0.1:8088"
      DLE_HTTPS_PORT: "127.0.0.1:8443"
      # Placeholders, as in the gates job, so that "Stack logs" and "Tear down" can interpolate the
      # compose file even when the job fails before the throw-away-secrets step.
      POSTGRES_PASSWORD: placeholder-overridden-before-the-stack-starts
      VALKEY_PASSWORD: placeholder-overridden-before-the-stack-starts
      DLE_MASTER_SECRET: placeholder-overridden-before-the-stack-starts-32chars
      DLE_EDGE_SECRET: placeholder-overridden-before-the-stack-starts-edge-32
      # `secrets` is not available in `if:`; it is in `env:`.
      HAS_LOADTEST_TARGET: ${{ secrets.DLE_LOADTEST_CONTROL_URL != '' && secrets.DLE_LOADTEST_API_KEY != '' && secrets.DLE_LOADTEST_DOMAIN_ID != '' && secrets.DLE_LOADTEST_LINK_HOST != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR (the packages may be private on first publish)
        if: ${{ env.HAS_LOADTEST_TARGET != 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Throw-away secrets for this stack
        # Four the compose file requires, and the owner key the stack is seeded with (dle_ + 8 + _ +
        # 43 characters, hex being a subset of the accepted alphabet). Random, masked, never reused.
        if: ${{ env.HAS_LOADTEST_TARGET != 'true' }}
        run: |
          pg="$(openssl rand -hex 24)"; vk="$(openssl rand -hex 24)"; ms="$(openssl rand -base64 48 | tr -d '\n')"; es="$(openssl rand -base64 48 | tr -d '\n')"
          key="dle_$(openssl rand -hex 4)_$(openssl rand -hex 22 | cut -c1-43)"
          echo "::add-mask::$pg"; echo "::add-mask::$vk"; echo "::add-mask::$ms"; echo "::add-mask::$es"; echo "::add-mask::$key"
          echo "POSTGRES_PASSWORD=$pg" >> "$GITHUB_ENV"
          echo "VALKEY_PASSWORD=$vk" >> "$GITHUB_ENV"
          echo "DLE_MASTER_SECRET=$ms" >> "$GITHUB_ENV"
          echo "DLE_EDGE_SECRET=$es" >> "$GITHUB_ENV"
          echo "DLE_BOOTSTRAP_INITIAL_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Start the stack from the released images
        if: ${{ env.HAS_LOADTEST_TARGET != 'true' }}
        run: |
          export DLE_LOADTEST_EDGE_CPUS="$(nproc)"
          echo "DLE_LOADTEST_EDGE_CPUS=$DLE_LOADTEST_EDGE_CPUS" >> "$GITHUB_ENV"
          # A self-hosted machine may still hold the stack of an interrupted run.
          docker compose $COMPOSE_FILES down --volumes --remove-orphans || true
          docker compose $COMPOSE_FILES pull --quiet
          docker compose $COMPOSE_FILES up -d --no-build --wait --wait-timeout 300
          curl -fsS http://127.0.0.1:8080/healthz && echo " edge healthy"
          curl -fsS http://127.0.0.1:8081/readyz  && echo " control ready"

      - name: Set up k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0

      - name: Set up Node 22 (seeder)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: k6 — resolve load profile
        id: k6
        # A pre-release tag gets past a miss (reported, and the release stays a pre-release); a
        # plain tag does not.
        continue-on-error: ${{ needs.version.outputs.prerelease == 'true' }}
        env:
          DLE_CONTROL_URL: ${{ secrets.DLE_LOADTEST_CONTROL_URL }}
          DLE_API_KEY: ${{ secrets.DLE_LOADTEST_API_KEY }}
          DLE_DOMAIN_ID: ${{ secrets.DLE_LOADTEST_DOMAIN_ID }}
          DLE_LINK_HOST: ${{ secrets.DLE_LOADTEST_LINK_HOST }}
        run: |
          rm -rf k6-out && mkdir -p k6-out
          if [ "$HAS_LOADTEST_TARGET" = "true" ]; then
            echo "target=staging" >> "$GITHUB_OUTPUT"
            # Seed the corpus (prefix k6load; links from an earlier run are kept), then run.
            node tests/load/seed.js --total 10000 --hot 100
            (cd k6-out && k6 run -e BASE_URL="https://${DLE_LINK_HOST}" --summary-export k6-summary.json ../tests/load/resolve.js)
            { echo "### k6 load profile"; echo; echo "Ran against the staging target https://${DLE_LINK_HOST}; thresholds in tests/load/resolve.js held."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "target=runner" >> "$GITHUB_OUTPUT"
          status=0
          DLE_API_KEY="$DLE_BOOTSTRAP_INITIAL_API_KEY" DLE_CONTROL_URL="" DLE_DOMAIN_ID="" DLE_LINK_HOST="" \
            bash tests/load/run-on-compose.sh k6-out || status=$?
          { echo "### k6 load profile"; echo; cat k6-out/report.md 2>/dev/null || echo "No report: the run stopped before k6."; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload k6 summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: k6-out/
          if-no-files-found: ignore
          retention-days: 90

      - name: Stack logs (on failure)
        if: ${{ failure() && env.HAS_LOADTEST_TARGET != 'true' }}
        run: docker compose $COMPOSE_FILES logs --no-color --tail 300

      - name: Tear down
        if: ${{ always() && env.HAS_LOADTEST_TARGET != 'true' }}
        run: docker compose $COMPOSE_FILES down --volumes --remove-orphans

  # ---------------------------------------------------------------------------------------------
  promote:
    name: Promote dle-${{ matrix.image }} to MAJOR.MINOR and latest
    # Only a plain tag whose k6 gate passed moves the tags that follow a release line (see the
    # header). The index is re-tagged by digest, so the signature and attestations made in `images`
    # still apply.
    needs: [version, images, gates, loadtest]
    if: ${{ needs.version.outputs.prerelease == 'false' && needs.loadtest.outputs.loadtest == 'ran' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [edge, control]
    steps:
      - name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digest-${{ matrix.image }}
          path: digests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the gated digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ref="$(cat "digests/dle-${{ matrix.image }}.txt")"
          repo="${ref%@*}"
          minor="$(printf '%s' "$VERSION" | cut -d. -f1,2)"
          docker buildx imagetools create --tag "${repo}:${minor}" --tag "${repo}:latest" "$ref"
          echo "dle-${{ matrix.image }}: ${repo}:${minor} and :latest -> ${ref#*@}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  release:
    name: GitHub release
    needs: [version, ci, sbom, images, helm, gates, loadtest, promote]
    # promote is skipped for a pre-release tag (and only a pre-release tag gets past a failed k6
    # gate); neither must skip the release. A failure anywhere
    # (a job skipped because its own need failed leaves that failure in the list) still blocks it.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # cosign sign-blob (keyless)
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download SBOM/CBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: assets/sbom

      - name: Download Helm chart
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: assets/chart

      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: assets/digests

      - name: Download k6 report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: k6-summary
          path: assets/k6

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign SBOM, CBOM and chart (keyless blob signatures, Sigstore bundles)
        run: |
          for f in assets/sbom/*.cdx.json assets/chart/*.tgz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l assets/sbom assets/chart

      - name: Release notes header
        env:
          LOADTEST: ${{ needs.loadtest.outputs.loadtest }}
          LOADTEST_TARGET: ${{ needs.loadtest.outputs.loadtest_target }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Artefacts"
            echo
            echo "| Image | Digest |"; echo "|---|---|"
            for f in assets/digests/*.txt; do n="$(basename "$f" .txt)"; echo "| $n | \`$(cat "$f")\` |"; done
            echo
            echo "Helm chart: \`oci://ghcr.io/${{ needs.version.outputs.owner }}/charts/dle\` version \`${VERSION}\` (also attached)."
            echo
            echo "Attached: CycloneDX SBOMs (.NET, web SDK, admin console), the CBOM, the chart, and a \`.sigstore.json\` bundle for each."
            echo
            echo "## Verify"
            echo
            echo '```sh'
            echo "cosign verify ghcr.io/${{ needs.version.outputs.owner }}/dle-edge:${VERSION} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '^https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/v'"
            echo "cosign verify-blob --bundle dle-cbom.cdx.json.sigstore.json dle-cbom.cdx.json \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '^https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/v'"
            echo '```'
            echo
            echo "## Gates"
            echo
            echo "- CI (build, format, unit, contract, security, integration suites, coverage gate): passed"
            echo "- Trivy (CRITICAL/HIGH with a fix available) against the released images (linux/amd64): passed; SLSA provenance and per-image SBOM attached to each index"
            echo "- Compose smoke and OWASP ZAP baseline against the released images: passed"
            if [ "$LOADTEST_TARGET" = "staging" ]; then where="against the staging target"; else where="on the release machine, against the compose stack from the released images"; fi
            if [ "$LOADTEST" = "ran" ]; then
              echo "- k6 resolve load profile: passed $where (thresholds in tests/load/resolve.js)"
            elif [ -f assets/k6/k6-summary.json ]; then
              echo "- k6 resolve load profile: **FAILED** $where — reported rather than blocking because this is a pre-release tag"
            else
              echo "- k6 resolve load profile: **did not complete** $where (stopped before k6; see the loadtest job log) — this is a pre-release tag"
            fi
            if [ -f assets/k6/report.md ]; then echo; sed 's/^/  /' assets/k6/report.md; fi
            echo
          } > notes.md
          cat notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: DLE ${{ needs.version.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' || needs.loadtest.outputs.loadtest != 'ran' }}
          fail_on_unmatched_files: true
          files: |
            assets/sbom/*.cdx.json
            assets/sbom/*.sigstore.json
            assets/chart/*.tgz
            assets/chart/*.sigstore.json
            assets/digests/*.txt
