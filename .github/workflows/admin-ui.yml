# =============================================================================
# Admin console (src/Dle.Admin.Web) — React 19 / TypeScript / Vite.
#
# Path-filtered: only runs when the SPA or this workflow changes. `npm run build` is
# `tsc -b && vite build`, so the type check is part of the build. The dist/ it produces is what
# Dle.Control's CopyAdminSpa MSBuild target copies to wwwroot/admin (and what Dockerfile.control
# builds in its own `spa` stage) — this job proves that build is green on a clean machine.
# =============================================================================
name: Admin UI

on:
  pull_request:
    paths:
      - "src/Dle.Admin.Web/**"
      - ".github/workflows/admin-ui.yml"
  push:
    branches: [develop, master]
    paths:
      - "src/Dle.Admin.Web/**"
      - ".github/workflows/admin-ui.yml"

permissions:
  contents: read

concurrency:
  group: admin-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Dle.Admin.Web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        # Same major as deploy/docker/Dockerfile.control (node:22-alpine); engines says >= 20.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Dle.Admin.Web/package-lock.json

      - name: Install (clean, from the lock file)
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Build (tsc -b && vite build)
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-ui-dist-${{ github.sha }}
          path: src/Dle.Admin.Web/dist/
          retention-days: 7
