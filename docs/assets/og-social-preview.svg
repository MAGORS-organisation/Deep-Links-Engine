<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" role="img" aria-label="Deep Link Engine Social Preview">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="secondaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#centerGlow)" />
  <rect width="1200" height="630" fill="url(#purpleGlow)" />

  <!-- Outer Elegant Frame -->
  <rect width="1180" height="610" x="10" y="10" rx="24" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />

  <!-- Center Card Content -->
  <g transform="translate(0, 0)">
    <!-- Top Pill -->
    <g transform="translate(485, 54)">
      <rect width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="115" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="750" letter-spacing="0.12em" fill="#38bdf8">OPEN-SOURCE CORE</text>
    </g>

    <!-- Center Iconic Mark -->
    <g transform="translate(515, 110) scale(0.33)" filter="url(#cardShadow)">
      <rect width="512" height="512" rx="128" fill="#0b1120" />
      <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#beamGrad)" stroke-width="4" stroke-opacity="0.4" />
      <circle cx="256" cy="256" r="160" fill="url(#primaryGrad)" opacity="0.2" filter="url(#softGlow)" />

      <path d="M 220 160 H 170 A 66 66 0 0 0 104 226 V 286 A 66 66 0 0 0 170 352 H 220 A 66 66 0 0 0 286 286 H 240 A 20 20 0 0 1 220 306 H 170 A 20 20 0 0 1 150 286 V 226 A 20 20 0 0 1 170 206 H 220 A 20 20 0 0 1 240 226 H 286 A 66 66 0 0 0 220 160 Z"
            fill="url(#primaryGrad)" />
      <path d="M 292 352 H 342 A 66 66 0 0 0 408 286 V 226 A 66 66 0 0 0 342 160 H 292 A 66 66 0 0 0 226 226 H 272 A 20 20 0 0 1 292 206 H 342 A 20 20 0 0 1 362 226 V 286 A 20 20 0 0 1 342 306 H 292 A 20 20 0 0 1 272 286 H 226 A 66 66 0 0 0 292 352 Z"
            fill="url(#secondaryGrad)" />
      <path d="M 198 274 L 282 190 A 18 18 0 0 1 314 222 L 230 306 A 18 18 0 0 1 198 274 Z"
            fill="url(#beamGrad)" filter="url(#softGlow)" />
      <circle cx="342" cy="256" r="16" fill="#ffffff" filter="url(#softGlow)" />
      <circle cx="170" cy="256" r="12" fill="#38bdf8" />
    </g>

    <!-- Main Title -->
    <text x="600" y="340" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="64"
          font-weight="850"
          letter-spacing="-0.03em"
          fill="#ffffff">Deep Link Engine</text>

    <!-- Tagline -->
    <text x="600" y="390" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="22"
          font-weight="600"
          letter-spacing="0.04em"
          fill="#38bdf8">Self-Hosted, EU-First Deep Linking &amp; Install Attribution</text>

    <!-- Subtitle description -->
    <text x="600" y="435" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="16"
          font-weight="400"
          fill="#94a3b8">The privacy-preserving open-source alternative to Firebase Dynamic Links, Branch &amp; AppsFlyer.</text>

    <!-- Feature Grid / Pills at Bottom -->
    <g transform="translate(180, 480)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="190" height="70" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="95" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Universal &amp; App Links</text>
      <text x="95" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">iOS 18 + Android 15</text>

      <!-- Box 2 -->
      <rect x="210" y="0" width="200" height="70" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="310" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Deterministic Matching</text>
      <text x="310" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Play Referrer + Claim Codes</text>

      <!-- Box 3 -->
      <rect x="430" y="0" width="200" height="70" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="530" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Zero Fingerprinting</text>
      <text x="530" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">ePrivacy &amp; GDPR Compliant</text>

      <!-- Box 4 -->
      <rect x="650" y="0" width="190" height="70" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="745" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">High Throughput</text>
      <text x="745" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">.NET 10 + Valkey L1/L2</text>
    </g>
  </g>
</svg>
