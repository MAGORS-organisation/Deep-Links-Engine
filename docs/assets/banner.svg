<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" role="img" aria-label="Deep Link Engine Hero Banner">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090a16" />
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="cyanGlow" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetGlow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Brand Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="secondaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Pattern: Subtle Grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#grid)" />
  <rect width="1200" height="380" fill="url(#cyanGlow)" />
  <rect width="1200" height="380" fill="url(#violetGlow)" />

  <!-- Outer Border Frame -->
  <rect width="1196" height="376" x="2" y="2" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Left: Glowing Icon Mark -->
  <g transform="translate(70, 70) scale(0.46)">
    <!-- Base Squircle -->
    <rect width="512" height="512" rx="128" fill="#0b1120" />
    <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#beamGrad)" stroke-width="4" stroke-opacity="0.4" />
    <circle cx="256" cy="256" r="160" fill="url(#primaryGrad)" opacity="0.15" filter="url(#softGlow)" />

    <!-- Geometry -->
    <path d="M 220 160 H 170 A 66 66 0 0 0 104 226 V 286 A 66 66 0 0 0 170 352 H 220 A 66 66 0 0 0 286 286 H 240 A 20 20 0 0 1 220 306 H 170 A 20 20 0 0 1 150 286 V 226 A 20 20 0 0 1 170 206 H 220 A 20 20 0 0 1 240 226 H 286 A 66 66 0 0 0 220 160 Z"
          fill="url(#primaryGrad)" />
    <path d="M 292 352 H 342 A 66 66 0 0 0 408 286 V 226 A 66 66 0 0 0 342 160 H 292 A 66 66 0 0 0 226 226 H 272 A 20 20 0 0 1 292 206 H 342 A 20 20 0 0 1 362 226 V 286 A 20 20 0 0 1 342 306 H 292 A 20 20 0 0 1 272 286 H 226 A 66 66 0 0 0 292 352 Z"
          fill="url(#secondaryGrad)" />
    <path d="M 198 274 L 282 190 A 18 18 0 0 1 314 222 L 230 306 A 18 18 0 0 1 198 274 Z"
          fill="url(#beamGrad)" filter="url(#softGlow)" />
    <circle cx="342" cy="256" r="16" fill="#ffffff" filter="url(#softGlow)" />
    <circle cx="170" cy="256" r="12" fill="#38bdf8" />
  </g>

  <!-- Right: Branding & Hero Content -->
  <g transform="translate(360, 64)">
    <!-- Top Super-Tag -->
    <rect x="0" y="0" width="226" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="12" y="17"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="0.1em"
          fill="#38bdf8">EU PRIVACY &amp; SOVEREIGNTY</text>

    <!-- Main Title -->
    <text x="0" y="80"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="56"
          font-weight="850"
          letter-spacing="-0.03em"
          fill="#ffffff">Deep Link Engine</text>

    <!-- Subtitle -->
    <text x="0" y="122"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="18"
          font-weight="600"
          letter-spacing="0.01em"
          fill="#94a3b8">Self-Hosted Deep Linking &amp; Install Attribution for Mobile Apps</text>

    <!-- Short description -->
    <text x="0" y="152"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="14"
          font-weight="400"
          fill="#64748b">Direct Universal Links, Android App Links, deterministic deferred attribution &amp; zero third-party data tracking.</text>

    <!-- Badges Row -->
    <g transform="translate(0, 186)" filter="url(#badgeShadow)">
      <!-- Badge 1: .NET 10 -->
      <rect x="0" y="0" width="102" height="30" rx="6" fill="#1e1e38" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
      <text x="12" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="650" fill="#a5b4fc">⚡ .NET 10 LTS</text>

      <!-- Badge 2: Postgres & Valkey -->
      <rect x="112" y="0" width="168" height="30" rx="6" fill="#0f2338" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5" />
      <text x="124" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="650" fill="#7dd3fc">🐘 Postgres 18 • Valkey 8</text>

      <!-- Badge 3: Universal & App Links -->
      <rect x="290" y="0" width="186" height="30" rx="6" fill="#13271e" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
      <text x="302" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="650" fill="#6ee7b7">📱 Universal &amp; App Links</text>

      <!-- Badge 4: React 19 Console -->
      <rect x="486" y="0" width="136" height="30" rx="6" fill="#1e2238" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="498" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="650" fill="#93c5fd">⚛️ React 19 SPA</text>

      <!-- Badge 5: MIT -->
      <rect x="632" y="0" width="100" height="30" rx="6" fill="#2d1c32" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.5" />
      <text x="644" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="650" fill="#fda4af">🛡️ MIT License</text>
    </g>
  </g>
</svg>
