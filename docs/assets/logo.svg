<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%" role="img" aria-label="Deep Link Engine Logo">
  <defs>
    <!-- Core Brand Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="secondaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(30, 26) scale(0.32)" filter="url(#iconShadow)">
    <!-- Container Base Plate (squircle) -->
    <rect width="512" height="512" rx="128" fill="#0f172a" />
    <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#beamGrad)" stroke-width="4" stroke-opacity="0.35" />

    <!-- Left Loop -->
    <path d="M 220 160 H 170 A 66 66 0 0 0 104 226 V 286 A 66 66 0 0 0 170 352 H 220 A 66 66 0 0 0 286 286 H 240 A 20 20 0 0 1 220 306 H 170 A 20 20 0 0 1 150 286 V 226 A 20 20 0 0 1 170 206 H 220 A 20 20 0 0 1 240 226 H 286 A 66 66 0 0 0 220 160 Z"
          fill="url(#primaryGrad)" />

    <!-- Right Loop -->
    <path d="M 292 352 H 342 A 66 66 0 0 0 408 286 V 226 A 66 66 0 0 0 342 160 H 292 A 66 66 0 0 0 226 226 H 272 A 20 20 0 0 1 292 206 H 342 A 20 20 0 0 1 362 226 V 286 A 20 20 0 0 1 342 306 H 292 A 20 20 0 0 1 272 286 H 226 A 66 66 0 0 0 292 352 Z"
          fill="url(#secondaryGrad)" />

    <!-- Bridge & Target Spark -->
    <path d="M 198 274 L 282 190 A 18 18 0 0 1 314 222 L 230 306 A 18 18 0 0 1 198 274 Z"
          fill="url(#beamGrad)" filter="url(#softGlow)" />
    <circle cx="342" cy="256" r="14" fill="#ffffff" filter="url(#softGlow)" />
    <circle cx="170" cy="256" r="10" fill="#38bdf8" />
  </g>

  <!-- Typography: Deep Link Engine -->
  <g transform="translate(230, 0)">
    <text x="0" y="96"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="54"
          font-weight="800"
          letter-spacing="-0.025em"
          fill="url(#textGrad)">Deep Link Engine</text>

    <!-- Subtitle / Mission Tagline -->
    <text x="2" y="140"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="16"
          font-weight="700"
          letter-spacing="0.18em"
          fill="#38bdf8">EU-FIRST DEEP LINKING &amp; ATTRIBUTION</text>

    <!-- Accent divider rule -->
    <rect x="2" y="158" width="560" height="3" rx="1.5" fill="url(#beamGrad)" opacity="0.6" />

    <text x="2" y="186"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="14"
          font-weight="500"
          letter-spacing="0.04em"
          fill="#94a3b8">Universal Links • App Links • Deferred Attribution • Self-Hosted</text>
  </g>
</svg>
